apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  sources:
    repoURL: https://github.com/mltmedeiros/argocd-terraform-controller.git
    targetRevision: HEAD
    path: examples/argocd/guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
